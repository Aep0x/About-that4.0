<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About That</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0a1020;
color:white;
}

.header{
background:#d94f67;
padding:18px;
font-size:30px;
font-weight:bold;
text-align:center;
position:sticky;
top:0;
}

.subheader{
text-align:center;
padding:10px;
color:#ccc;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#12192f;
padding:18px;
margin-bottom:15px;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

.card h3{
color:#ff708b;
margin-bottom:10px;
}

.screen{
display:none;
}

.active{
display:block;
}

button{
background:#d94f67;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

input,
textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

.story{
background:#12192f;
padding:20px;
border-radius:15px;
}

.like-section{
margin-top:15px;
display:flex;
gap:10px;
}

.back{
margin-bottom:15px;
}

.login-box{
background:#12192f;
padding:20px;
border-radius:15px;
margin-top:20px;
}

.admin-post{
background:#12192f;
padding:20px;
border-radius:15px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="header">ABOUT THAT</div>

<div id="home" class="screen active">
<div class="subheader">
Bayview High's favoriete roddelblog<br>
Door Simon Kelleher
</div>

<div class="container">
<button onclick="showLogin()">
Simon Login
</button>

<div id="gossipList"></div>
</div>
</div>

<div id="storyPage" class="screen">
<div class="container">

<button class="back" onclick="goHome()">
← Terug
</button>

<div class="story">

<h2 id="storyTitle"></h2>

<p id="storyContent"></p>

<div class="like-section">
<button onclick="likePost()">
👍 <span id="likes">0</span>
</button>

<button onclick="dislikePost()">
👎 <span id="dislikes">0</span>
</button>
</div>

</div>
</div>
</div>

<div id="loginPage" class="screen">
<div class="container">

<button onclick="goHome()">
← Terug
</button>

<div class="login-box">
<h2>Simon Login</h2>

<input
id="username"
placeholder="Gebruikersnaam">

<input
id="password"
type="password"
placeholder="Wachtwoord">

<button onclick="login()">
Inloggen
</button>

</div>
</div>
</div>

<div id="adminPage" class="screen">
<div class="container">

<h2>Simon's Dashboard</h2>

<div class="admin-post">

<input
id="newTitle"
placeholder="Titel">

<textarea
id="newStory"
placeholder="Volledig verhaal"></textarea>

<button onclick="publishPost()">
Publiceer roddel
</button>

</div>

<button onclick="logout()">
Uitloggen
</button>

</div>
</div>

<script>

let posts = JSON.parse(localStorage.getItem("posts")) || [
{
title:"SEKSTAPE-SCHANDAAL",
story:"Iedereen op Bayview High praat over een mysterieuze video waarin mogelijk leerling L.M. betrokken zou zijn. Niemand weet wat waar is, maar het gerucht verspreidt zich razendsnel.",
likes:12,
dislikes:2
},
{
title:"ZWANGERSCHAPSPANIEK",
story:"Volgens bronnen maakt E.R. zich zorgen over een geheim dat alles kan veranderen. Het gerucht gaat al dagen rond op Bayview High.",
likes:8,
dislikes:1
},
{
title:"VREEMDGAAN #1",
story:"K.T.'s ogenschijnlijk perfecte relatie blijkt misschien niet zo perfect als iedereen dacht.",
likes:6,
dislikes:3
},
{
title:"VREEMDGAAN #2",
story:"De initialen M.S. worden steeds vaker genoemd in een nieuw schandaal over ontrouw.",
likes:10,
dislikes:2
}
];

let currentPost = 0;

function saveData(){
localStorage.setItem(
"posts",
JSON.stringify(posts)
);
}

function renderPosts(){

const list =
document.getElementById("gossipList");

list.innerHTML = "";

posts.forEach((post,index)=>{

list.innerHTML += `
<div class="card"
onclick="openStory(${index})">

<h3>${post.title}</h3>

<p>
Klik om het volledige verhaal te lezen...
</p>

</div>
`;

});

}

function openStory(index){

currentPost = index;

const post = posts[index];

document.getElementById("storyTitle").innerText =
post.title;

document.getElementById("storyContent").innerText =
post.story;

document.getElementById("likes").innerText =
post.likes;

document.getElementById("dislikes").innerText =
post.dislikes;

showScreen("storyPage");

}

function likePost(){

posts[currentPost].likes++;

saveData();

document.getElementById("likes").innerText =
posts[currentPost].likes;

}

function dislikePost(){

posts[currentPost].dislikes++;

saveData();

document.getElementById("dislikes").innerText =
posts[currentPost].dislikes;

}

function login(){

const u =
document.getElementById("username").value;

const p =
document.getElementById("password").value;

if(
u === "SimonKelleher" &&
p === "aboutthat"
){

showScreen("adminPage");

}
else{

alert("Foute gegevens");

}

}

function logout(){

showScreen("home");

}

function publishPost(){

const title =
document.getElementById("newTitle").value;

const story =
document.getElementById("newStory").value;

if(!title || !story) return;

posts.unshift({
title,
story,
likes:0,
dislikes:0
});

saveData();
renderPosts();

document.getElementById("newTitle").value = "";
document.getElementById("newStory").value = "";

alert("Roddel gepubliceerd!");

}

function showScreen(id){

document
.querySelectorAll(".screen")
.forEach(s => s.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}

function goHome(){

showScreen("home");

}

function showLogin(){

showScreen("loginPage");

}

renderPosts();

</script>

</body>
</html>
